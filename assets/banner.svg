<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Fix-doc Copilot: Chat with a technician, get a clean, searchable fix document.">
<title>Fix-doc Copilot: Chat with a technician, get a clean, searchable fix document.</title>
<defs>
<radialGradient id="glow" cx="82%" cy="18%" r="70%"><stop offset="0" stop-color="#38bdf8" stop-opacity=".20"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
<clipPath id="card"><rect width="1200" height="320" rx="20"/></clipPath>

