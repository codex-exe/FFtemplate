<g transform="translate(640,40)"><rect x="8" y="46" width="172" height="48" rx="14" fill="#101a2e" stroke="#22304d" stroke-width="1.5"/><text x="22" y="67" font-size="11.5" fill="#8b9bb4" class="mono">tech</text><text x="22" y="84" font-size="12" fill="#e6edf3">"Screen flickers after 2.1"</text><rect x="28" y="108" width="152" height="48" rx="14" fill="#101a2e" stroke="#38bdf8" stroke-opacity=".6" stroke-width="1.5"/><text x="42" y="129" font-size="11.5" fill="#38bdf8" class="mono">copilot</text><text x="42" y="146" font-size="12" fill="#e6edf3" class="mono">update_document()</text><path class="flow" d="M188,120 H222" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="3 8" stroke-linecap="round"/><rect x="232" y="16" width="156" height="208" rx="10" fill="#101a2e" stroke="#e6edf3" stroke-opacity=".85" stroke-width="2"/><rect x="232" y="16" width="156" height="30" rx="10" fill="#38bdf8" fill-opacity=".18"/><text x="310" y="36" font-size="12.5" font-weight="700" fill="#38bdf8" text-anchor="middle" class="mono">TECH-FIX-0001</text><text x="246" y="62" font-size="9.5" fill="#5b6b86" class="mono">Title</text><rect x="246" y="68" width="128" height="8" rx="4" fill="#22304d"/><rect class="fill" style="animation-delay:0.0s" x="246" y="68" width="96" height="8" rx="4" fill="#38bdf8"/><text x="246" y="95" font-size="9.5" fill="#5b6b86" class="mono">Severity</text><rect x="246" y="101" width="128" height="8" rx="4" fill="#22304d"/><rect class="fill" style="animation-delay:0.5s" x="246" y="101" width="48" height="8" rx="4" fill="#38bdf8"/><text x="246" y="128" font-size="9.5" fill="#5b6b86" class="mono">Steps to reproduce</text><rect x="246" y="134" width="128" height="8" rx="4" fill="#22304d"/><rect class="fill" style="animation-delay:1.0s" x="246" y="134" width="112" height="8" rx="4" fill="#38bdf8"/><text x="246" y="161" font-size="9.5" fill="#5b6b86" class="mono">Solution steps</text><rect x="246" y="167" width="128" height="8" rx="4" fill="#22304d"/><rect class="fill" style="animation-delay:1.5s" x="246" y="167" width="104" height="8" rx="4" fill="#38bdf8"/><text x="246" y="194" font-size="9.5" fill="#5b6b86" class="mono">Validation</text><rect x="246" y="200" width="128" height="8" rx="4" fill="#22304d"/><rect class="fill" style="animation-delay:2.0s" x="246" y="200" width="72" height="8" rx="4" fill="#38bdf8"/><path class="flow" d="M396,120 H430" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="3 8" stroke-linecap="round"/><rect x="440" y="44" width="68" height="58" rx="10" fill="#101a2e" stroke="#22304d" stroke-width="1.5"/><text x="474" y="79" font-size="15" font-weight="700" fill="#fb7185" text-anchor="middle" class="mono">PDF</text><g fill="#101a2e" stroke="#38bdf8" stroke-width="2"><path d="M448,136 v40 a26,9 0 0 0 52,0 v-40"/><ellipse cx="474" cy="136" rx="26" ry="9"/><path d="M448,156 a26,9 0 0 0 52,0" fill="none"/></g><text x="474" y="210" font-size="11" fill="#8b9bb4" text-anchor="middle">AI Search index</text></g>

